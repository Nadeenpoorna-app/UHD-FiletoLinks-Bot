
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NadeenXdev | File Streaming</title>

  <link rel="shortcut icon" href="https://i.ibb.co/xvhxLDH/IMG-20251026-WA0003.jpg" type="image/x-icon">
  <meta property="og:image" content="https://i.ibb.co/xvhxLDH/IMG-20251026-WA0003.jpg" itemprop="thumbnailUrl">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root{
      --neon-pink:#ff00c8;
      --neon-blue:#00f7ff;
      --neon-purple:#9d00ff;
      --dark:#07070c;
      --grid:rgba(255,255,255,0.05);
      --glass:rgba(10,10,25,0.78);
      --stroke:rgba(255,255,255,0.10);
      --shadow:0 0 24px rgba(0,247,255,0.22);
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{
      font-family:'Orbitron',sans-serif;
      background: radial-gradient(1200px 800px at 50% 10%, rgba(157,0,255,0.22), transparent 55%),
                  radial-gradient(900px 700px at 10% 35%, rgba(0,247,255,0.18), transparent 55%),
                  radial-gradient(900px 700px at 90% 30%, rgba(255,0,200,0.14), transparent 55%),
                  linear-gradient(180deg, #06060b 0%, #120024 100%);
      color:#fff;
      overflow-x:hidden;
      display:flex;
      justify-content:center;
      padding:40px 15px;
      position:relative;
      isolation:isolate;
    }

    /* subtle grid */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        repeating-linear-gradient(to right, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 60px),
        repeating-linear-gradient(to bottom, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 60px);
      opacity:.55;
      z-index:-3;
      pointer-events:none;
    }

    /* scanlines */
    body::after{
      content:"";
      position:fixed; inset:-10px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.04) 0px,
        rgba(255,255,255,0.02) 1px,
        transparent 3px,
        transparent 6px
      );
      mix-blend-mode:overlay;
      opacity:.25;
      z-index:-2;
      pointer-events:none;
    }

    /* cinematic vignette + orbs */
    .vignette{
      position:fixed; inset:-40px;
      pointer-events:none;
      z-index:-1;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(0,0,0,.62) 100%),
        radial-gradient(circle at 20% 15%, rgba(0,247,255,.14), transparent 45%),
        radial-gradient(circle at 80% 20%, rgba(255,0,200,.12), transparent 45%),
        radial-gradient(circle at 55% 85%, rgba(157,0,255,.12), transparent 55%);
      filter: blur(0.2px);
    }

    .orb{
      position:fixed;
      width:240px;height:240px;
      border-radius:999px;
      filter: blur(28px);
      opacity:.28;
      z-index:-2;
      pointer-events:none;
      animation: floaty 10s ease-in-out infinite;
    }
    .orb.o1{left:-60px;top:140px;background:rgba(0,247,255,.9);animation-duration:12s;}
    .orb.o2{right:-70px;top:90px;background:rgba(255,0,200,.9);animation-duration:14s;}
    .orb.o3{left:40%;bottom:-90px;background:rgba(157,0,255,.9);animation-duration:16s;}

    @keyframes floaty{
      0%{transform:translate(0,0) scale(1);}
      50%{transform:translate(18px,-14px) scale(1.06);}
      100%{transform:translate(0,0) scale(1);}
    }

    .container{
      width:100%;
      max-width:920px;
      text-align:center;
      z-index:1;
      animation: enter 700ms ease both;
    }

    @keyframes enter{
      from{opacity:0;transform:translateY(14px) scale(.985);}
      to{opacity:1;transform:translateY(0) scale(1);}
    }

    .header{
      margin-bottom:22px;
      position:relative;
    }

    .header h1{
      font-family:'Press Start 2P',cursive;
      font-size:2rem;
      background:linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:0 0 10px rgba(255,0,200,.55), 0 0 16px rgba(0,247,255,.45);
      margin-bottom:10px;
      letter-spacing:1px;
      display:inline-flex;
      gap:10px;
      align-items:center;
    }

    .subtitle{
      font-size:.98rem;
      color:#cfcfe8;
      opacity:.92;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-top:12px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.18);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      font-size:.85rem;
      color:#e7e7ff;
    }
    .badge b{color:var(--neon-blue);}

    .card{
      background:var(--glass);
      border-radius:18px;
      padding:26px;
      border:2px solid rgba(157,0,255,0.55);
      box-shadow:0 0 18px rgba(157,0,255,.35), inset 0 0 22px rgba(255,255,255,0.06);
      margin:18px 0 22px;
      transition:transform .28s ease, box-shadow .28s ease;
      position:relative;
      overflow:hidden;
      backdrop-filter: blur(8px);
    }
    .card::before{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(800px 260px at 10% 0%, rgba(0,247,255,0.18), transparent 60%),
                  radial-gradient(700px 240px at 90% 0%, rgba(255,0,200,0.12), transparent 60%);
      opacity:.8;
      pointer-events:none;
    }
    .card:hover{
      transform:translateY(-6px) scale(1.015);
      box-shadow:0 0 24px rgba(157,0,255,.42), inset 0 0 22px rgba(255,255,255,0.07);
    }

    .card-title{
      font-family:'Press Start 2P',cursive;
      font-size:1rem;
      color:var(--neon-blue);
      margin-bottom:18px;
      text-shadow:0 0 12px rgba(0,247,255,.55);
      display:flex;
      justify-content:center;
      gap:10px;
      align-items:center;
      position:relative;
      z-index:1;
    }

    video{
      width:100%;
      border-radius:12px;
      border:2px solid rgba(255,0,200,0.65);
      background:#000;
      box-shadow:0 0 26px rgba(255,0,200,0.32);
      position:relative;
      z-index:1;
    }

    .file-info{
      margin-top:14px;
      font-size:.88rem;
      color:#c9c9df;
      position:relative;
      z-index:1;
    }
    .file-info b{color:var(--neon-blue);}

    .btn-group{
      margin-top:22px;
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      justify-content:center;
    }

    .btn{
      padding:12px 20px;
      border-radius:10px;
      font-size:.88rem;
      font-weight:700;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
      position:relative;
      overflow:hidden;
      font-family:'Orbitron',sans-serif;
      user-select:none;
      cursor:pointer;
      border:none;
      min-width: 170px;
    }

    .btn-primary{
      background:linear-gradient(135deg, var(--neon-pink), var(--neon-blue));
      color:#000;
      box-shadow:0 0 12px rgba(255,0,200,0.32), 0 0 18px rgba(0,247,255,0.22);
    }

    .btn-alt{
      background:rgba(0,0,0,0.18);
      border:2px solid rgba(0,247,255,0.65);
      color:var(--neon-blue);
      text-shadow:0 0 10px rgba(0,247,255,0.35);
      box-shadow:0 0 10px rgba(0,247,255,0.15);
    }

    /* cinematic button shine */
    .btn::before{
      content:"";
      position:absolute; inset:0;
      background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,.22) 40%, transparent 80%);
      transform:translateX(-140%);
      transition:.6s ease;
      pointer-events:none;
    }
    .btn:hover::before{ transform:translateX(140%); }
    .btn:hover{ transform: translateY(-2px) scale(1.05); }

    footer{
      margin-top:34px;
      font-size:.78rem;
      color:#b9b9cf;
      padding-top:16px;
      border-top:1px solid rgba(255,255,255,0.10);
    }
    footer b{
      color:var(--neon-pink);
      text-shadow:0 0 10px rgba(255,0,200,0.35);
    }

    .telegram-float{
      position:fixed;
      left:18px;
      bottom:90px;
      width:56px;
      height:56px;
      background:#ffffff;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none !important;
      line-height:0 !important;
      border:none;
      outline:none;
      font-size:28px;
      z-index:9999;
      box-shadow:0 0 18px rgba(0,136,204,0.6);
      transition:.25s ease;
    }
    .telegram-float i{
      color:#0088CC;
      line-height:1;
      text-decoration:none !important;
    }
    .telegram-float:hover{
      transform:scale(1.12);
      box-shadow:0 0 30px rgba(0,136,204,1);
    }

    .toast{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(5,5,10,.88);
      color:var(--neon-blue);
      padding:10px 18px;
      border-radius:10px;
      border:1px solid rgba(0,247,255,0.65);
      font-size:.9rem;
      text-shadow:0 0 10px rgba(0,247,255,0.35);
      box-shadow:0 0 16px rgba(0,255,255,0.25);
      opacity:0; visibility:hidden;
      transition:opacity .25s, visibility .25s, transform .25s;
      z-index:99999;
    }
    .toast.show{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(-4px); }

    /* Support modal */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.68);
      z-index:999999;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .modal .box{
      max-width:560px;
      width:100%;
      background:rgba(10,10,25,.96);
      border:2px solid rgba(0,247,255,0.7);
      border-radius:18px;
      padding:18px;
      box-shadow:0 0 26px rgba(0,247,255,0.22);
      text-align:center;
      backdrop-filter: blur(10px);
      animation: pop 220ms ease both;
    }
    @keyframes pop{
      from{opacity:0;transform:translateY(10px) scale(.98);}
      to{opacity:1;transform:translateY(0) scale(1);}
    }
    .modal h3{
      font-family:'Press Start 2P',cursive;
      font-size:.92rem;
      margin-bottom:10px;
      background:linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:0 0 10px rgba(0,247,255,0.25);
    }
    .modal p{
      color:#d7d7ee;
      font-size:.9rem;
      margin:0 0 14px;
      opacity:.92;
      line-height:1.4;
    }
    .modal .row{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .modal .row .btn{ min-width: 160px; }

    /* reduced motion */
    @media (prefers-reduced-motion: reduce){
      *{animation:none !important; transition:none !important;}
      .orb{display:none;}
    }

    @media (max-width: 600px){
      .header h1{font-size:1.35rem;}
      .btn{flex:1 1 100%; min-width: auto;}
      body{padding:28px 12px;}
    }
  </style>
</head>
<body>
  <div class="vignette"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>

  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-compact-disc fa-spin"></i> NADEEN NETWORK</h1>
      <p class="subtitle">Cinematic Streaming Experience</p>

      <div class="badge">
        🎬 <span>Now Playing:</span> <b>{{ file_name }}</b>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title"><i class="fas fa-play-circle"></i> {{ file_name }}</h2>

      <video controls preload="metadata" playsinline poster="https://i.ibb.co/xvhxLDH/IMG-20251026-WA0003.jpg">
        <source src="{{ file_url }}">
        Your browser does not support video playback.
      </video>

      <div class="file-info">
        <p><b>Size:</b> {{ file_size }}</p>
      </div>
    </div>

    <div class="btn-group">
      <a id="btnDownload" class="btn btn-primary" href="{{ file_url }}" download>
        <i class="fas fa-bolt"></i> Fast Download
      </a>

      <a id="btnWatch" class="btn btn-primary" href="{{ file_url }}" target="_blank" rel="noopener">
        <i class="fas fa-desktop"></i> Watch Online
      </a>

      <a id="btnMX" class="btn btn-alt" href="intent:{{ file_url }}#Intent;package=com.mxtech.videoplayer.ad;S.title={{ file_name }};end">
        <i class="fas fa-play"></i> MX Player
      </a>

      <a id="btnVLC" class="btn btn-alt" href="vlc://{{ file_url }}">
        <i class="fas fa-play-circle"></i> VLC Player
      </a>

      <button class="btn btn-alt" onclick="copyLink()">
        <i class="fas fa-link"></i> Copy Link
      </button>
    </div>

    <a href="https://t.me/nadeenx_dev" class="telegram-float" target="_blank" rel="noopener" aria-label="Telegram">
      <i class="fa-brands fa-telegram fa-beat"></i>
    </a>

    <footer>
      <p>© 2026 <b>NadeenXdev</b> • Developed by <b>Nadeen Poorna</b></p>
    </footer>
  </div>

  <div id="toast" class="toast">✅ Link copied!</div>

  <!-- Support Modal (user-friendly ads; no forced click) -->
  <div id="adModal" class="modal" role="dialog" aria-modal="true" aria-label="Support modal">
    <div class="box">
      <h3>SUPPORT</h3>
      <div class="row">
        <button id="btnContinue" class="btn btn-primary" type="button">
          Continue
        </button>

        <a id="btnSupportAd" class="btn btn-alt" target="_blank" rel="noopener">
          Support
        </a>

        <button id="btnCancel" class="btn btn-alt" type="button">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script>
    function copyLink() {
      navigator.clipboard.writeText("{{ file_url }}").then(() => {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
      });
    }

    // ✅ User-friendly ads (no forced click)
    const AD_URL = "https://twigcrucialpal.com/zyqjsvmaix?key=c4ed3dfd562ea7109a32876848338de6";

    const modal = document.getElementById("adModal");
    const btnSupportAd = document.getElementById("btnSupportAd");
    const btnContinue = document.getElementById("btnContinue");
    const btnCancel = document.getElementById("btnCancel");

    btnSupportAd.href = AD_URL;

    let pendingAction = null;

    function openModal(action) {
      pendingAction = action;
      modal.style.display = "flex";
    }
    function closeModal() {
      modal.style.display = "none";
      pendingAction = null;
    }

    // Hook main buttons
    const btnDownload = document.getElementById("btnDownload");
    const btnWatch = document.getElementById("btnWatch");

    if (btnDownload) {
      btnDownload.addEventListener("click", (e) => {
        e.preventDefault();
        const href = btnDownload.href;
        openModal(() => {
          // continue download
          window.location.href = href;
        });
      });
    }

    if (btnWatch) {
      btnWatch.addEventListener("click", (e) => {
        e.preventDefault();
        const href = btnWatch.href;
        openModal(() => {
          window.open(href, "_blank", "noopener");
        });
      });
    }

    btnContinue.addEventListener("click", () => {
      const action = pendingAction;
      closeModal();
      if (action) action();
    });

    btnCancel.addEventListener("click", closeModal);

    // Close modal when clicking outside the box
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  </script>

  <!-- Your ad script can load safely (does NOT auto-click) -->
  <script src="https://twigcrucialpal.com/63/fa/0f/63fa0fa83479664f96915936717641b4.js"></script>
</body>
</html>
